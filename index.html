<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Reading Speed</title>
  </head>
  <body>
    <header>
    <h1>How fast are you reading?</h1>
    <h2>Let's find out!</h2>
    </header>
    <div class="responsive-container">
      <div class="responsive-container-left">
            <div> <!-- words/5 lines -->
              <h2>Words / 5 lines</h2>
              <input id="words"></input>
            </div><!-- end words/5 lines -->
            <div><!-- lines/page -->
              <h2>Lines / page</h2>
              <input id="lines"></input>
            </div><!-- end lines/pag -->
          
      
          <div class="buttons">
            <button id="timer-btn">Start Timer</button><br>
            <button id="calculate-btn">Show Reading Speeds Per Times</button>
          </div><!-- end button -->
    </div><!-- end responsive-container-left -->

    <div class="responsive-container-right" id="container-right">
      <div id="speed-banner"></div>
      <section class="row">
        <div class="col">
          <ul id="time"></ul>
        </div> <!-- end col -->
        <div class="col">
          <ul id="speed"></ul>
        </div> <!-- end col-->
      </section>
    </div> <!-- end responsive-container-right -->

  </div> <!-- end responsive-container -->

    <script src="index.js"></script>
  </body>
</html>
